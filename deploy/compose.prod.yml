# Production / public demo stack for a server that already runs a Caddy
# reverse proxy on ports 80/443 (shared Docker network "edge").
#
#   docker network create edge                      # once per server
#   cp deploy/env.prod.example deploy/.env.prod     # then fill it in
#   docker compose -p blog -f deploy/compose.prod.yml --env-file deploy/.env.prod up -d --build
#
# Nothing is published on the host: Caddy reaches the app over "edge" as
# blog-web:8000 (HTTP and WebSockets). Database and Redis stay on this stack's
# private network. Every service has a "blog-" name because Docker adds the
# service name as a DNS alias, and other stacks on "edge" use plain names
# such as "web", "db" and "redis".

x-app: &app
  image: advanced-blog-system:latest   # one image for web, worker and beat
  build:
    context: ..
  restart: unless-stopped
  env_file: .env.prod
  environment: &app-env
    DJANGO_SETTINGS_MODULE: core.settings.production
    POSTGRES_HOST: blog-db
    POSTGRES_PORT: "5432"
    REDIS_HOST: blog-redis
    SERVE_MEDIA: "True"
  volumes:
    - media_data:/app/media
  depends_on:
    blog-db:
      condition: service_healthy
    blog-redis:
      condition: service_healthy

services:
  blog-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blog}
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  blog-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 96m

  blog-web:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/accounts/login/', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 512m
    networks:
      - default
      - edge

  blog-celery:
    <<: *app
    depends_on:
      blog-web:
        condition: service_healthy
    command: ["celery", "-A", "core", "worker", "-l", "info", "--concurrency", "2"]
    mem_limit: 384m

  blog-beat:
    <<: *app
    depends_on:
      blog-web:
        condition: service_healthy
    command: ["celery", "-A", "core", "beat", "-l", "info",
              "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    mem_limit: 192m

networks:
  edge:
    external: true

volumes:
  postgres_data:
  media_data:
