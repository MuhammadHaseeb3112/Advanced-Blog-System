{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong · MHBlogs</title>
    <link rel="icon" href="{% static 'brand/mark.svg' %}" type="image/svg+xml">
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; background: #f5f7fb; color: #0f172a; }
        .card { max-width: 440px; margin: 20px; background: #fff; border-radius: 24px; padding: 40px 36px; text-align: center; box-shadow: 0 14px 36px rgba(15, 23, 42, .1); }
        img { width: 64px; height: 64px; margin-bottom: 16px; }
        h1 { font-size: 26px; margin: 0 0 10px; }
        p { color: #64748b; line-height: 1.6; margin: 0 0 24px; }
        a { display: inline-block; padding: 13px 26px; border-radius: 14px; background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <img src="{% static 'brand/mark.svg' %}" alt="MHBlogs">
        <h1>Something went wrong</h1>
        <p>An unexpected error happened on our side. It has been logged; please try again in a moment.</p>
        <a href="/">Back to home</a>
    </div>
</body>
</html>
