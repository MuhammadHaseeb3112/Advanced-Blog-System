{% extends 'base.html' %}

{% block content %}

<div class="signup-wrapper">

    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>
    <div class="floating-shape shape-3"></div>

    <div class="signup-card">

        <div class="signup-header">

            <h1>Create Account</h1>

            <p>
                Join the Django Blog Community and start your journey.
            </p>

        </div>

        <form method="POST" class="signup-form">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="signup-btn">
                Create Account
            </button>

        </form>

        <div class="login-link">

            Already have an account?

            <a href="{% url 'login' %}">
                Sign In
            </a>

        </div>

    </div>

</div>

<style>
    .signup-wrapper {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
        position: relative;
        overflow: hidden;

        background:
            radial-gradient(circle at top left, #dbeafe 0%, transparent 35%),
            radial-gradient(circle at bottom right, #ede9fe 0%, transparent 35%),
            linear-gradient(135deg, #f8fafc, #ffffff);
    }

    .floating-shape {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        animation: float 8s ease-in-out infinite;
    }

    .shape-1 {
        width: 300px;
        height: 300px;
        background: #60a5fa;
        top: -100px;
        left: -100px;
    }

    .shape-2 {
        width: 250px;
        height: 250px;
        background: #a78bfa;
        bottom: -80px;
        right: -80px;
    }

    .shape-3 {
        width: 180px;
        height: 180px;
        background: #38bdf8;
        top: 50%;
        right: 15%;
    }

    .signup-card {
        width: 100%;
        max-width: 700px;

        background: rgba(255, 255, 255, .95);

        backdrop-filter: blur(15px);

        border: 1px solid rgba(255, 255, 255, .6);

        border-radius: 28px;

        padding: 50px;

        box-shadow:
            0 25px 60px rgba(0, 0, 0, .08);

        position: relative;
        z-index: 5;

        animation: slideUp .8s ease;
    }

    .signup-header {
        text-align: center;
        margin-bottom: 35px;
    }

    .signup-header h1 {
        font-size: 2.5rem;
        font-weight: 800;
        color: #111827;
        margin-bottom: 10px;
    }

    .signup-header p {
        color: #6b7280;
        font-size: 16px;
    }

    .signup-form p {
        margin-bottom: 18px;
    }

    .signup-form label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #374151;
    }

    .signup-form input {
        width: 100%;
        padding: 14px 16px;

        border: 1px solid #d1d5db;

        border-radius: 14px;

        font-size: 15px;

        transition: .3s;

        background: white;
    }

    .signup-form input:focus {
        outline: none;

        border-color: #2563eb;

        box-shadow:
            0 0 0 4px rgba(37, 99, 235, .15);
    }

    .signup-form ul {
        margin-top: 10px;
        padding-left: 20px;
        color: #6b7280;
        font-size: 14px;
    }

    .signup-btn {
        width: 100%;

        padding: 15px;

        border: none;

        border-radius: 14px;

        background:
            linear-gradient(135deg,
                #2563eb,
                #7c3aed);

        color: white;

        font-size: 16px;

        font-weight: 700;

        cursor: pointer;

        transition: .3s;

        margin-top: 10px;
    }

    .signup-btn:hover {
        transform: translateY(-3px);

        box-shadow:
            0 12px 25px rgba(37, 99, 235, .25);
    }

    .login-link {
        text-align: center;
        margin-top: 25px;
        color: #6b7280;
    }

    .login-link a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 700;
    }

    .login-link a:hover {
        color: #1d4ed8;
    }

    @keyframes float {

        0%,
        100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-30px);
        }
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(40px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

{% endblock %}
