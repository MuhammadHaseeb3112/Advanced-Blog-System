{% extends 'base.html' %}
{% block title %}Reset password · MHBlogs{% endblock %}

{% block content %}
<div class="auth-simple">
    <div class="auth-simple-card">
        <div class="icon">🔑</div>
        <h1>Reset your password</h1>
        <p>Enter your account email and we will send you a link to choose a new password.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Send reset link</button>
        </form>
        <a href="{% url 'login' %}" class="back-link">← Back to sign in</a>
    </div>
</div>
{% endblock %}
