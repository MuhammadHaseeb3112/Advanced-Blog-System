{# Brand logo: mark + "MHBlogs" wordmark. Pass size="sm" for a smaller version. #}
<span class="brand {% if size == 'sm' %}brand--sm{% endif %}">
    <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true">
        <defs><linearGradient id="brand-g-{{ id|default:'x' }}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
        <rect width="44" height="44" rx="12" fill="url(#brand-g-{{ id|default:'x' }})"/>
        <path d="M17 15 L10 22 L17 29 M27 15 L34 22 L27 29" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle class="brand-dot" cx="22" cy="22" r="3" fill="#34d399"/>
    </svg>
    <span class="brand-name">MH<span>Blogs</span></span>
</span>
